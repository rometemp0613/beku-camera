<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOOP Cloudflare Test</title>

<style>
html, body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}

body {
  text-align: center;
  padding: 40px 10px;
}

button {
  padding: 12px 20px;
  font-size: 18px;
}

#result {
  margin-top: 20px;
  color: #ff9fd1;
  font-size: 22px;
}
</style>
</head>

<body>

<h1>SOOP TEST</h1>
<p>Cloudflare Pages iframe 테스트입니다.</p>

<button id="testButton">눌러보기</button>

<div id="result">대기 중</div>

<script>
document.getElementById("testButton").addEventListener("click", () => {
  document.getElementById("result").textContent = "JS 작동함!";
});
</script>

</body>
</html>
